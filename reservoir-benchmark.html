<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservoir Browser Benchmark</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #101317; color: #e7edf0; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto minmax(420px, 1fr) auto; }
      header, footer { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1b2228; border-color: #37424c; border-style: solid; border-width: 0 0 1px; }
      footer { border-width: 1px 0 0; }
      h1 { margin: 0 auto 0 0; font-size: 15px; }
      button { border: 1px solid #46525d; background: #26313a; color: #e7edf0; padding: 5px 8px; cursor: pointer; }
      #reservoir-benchmark-viewport { min-height: 420px; }
      #reservoir-benchmark-result { margin: 0; overflow: auto; color: #b8c6d0; font: 11px Consolas, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header><h1>Reservoir Browser First-Render Benchmark</h1><button id="download-json" type="button">Download JSON</button><button id="download-markdown" type="button">Download Markdown</button></header>
    <main id="reservoir-benchmark-viewport"></main>
    <footer><output id="reservoir-benchmark-result">Preparing benchmark...</output></footer>
    <script type="module" src="/src/reservoir/benchmark/browser-entry.ts"></script>
  </body>
</html>
