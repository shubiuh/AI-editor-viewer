<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservoir Viewer Demo</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #101317; color: #e7edf0; }
      body { margin: 0; height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; background: #1b2228; border-bottom: 1px solid #37424c; }
      h1 { margin: 0 14px 0 0; font-size: 15px; }
      button, label { font: inherit; font-size: 12px; }
      button { border: 1px solid #46525d; background: #26313a; color: #e7edf0; padding: 5px 8px; cursor: pointer; }
      #reservoir-demo-status { margin-left: auto; color: #a7b4be; font-size: 12px; }
      .demo-content { display: grid; grid-template-rows: minmax(260px, 3fr) minmax(190px, 2fr); min-height: 0; }
      #reservoir-demo-viewport, #reservoir-demo-log-viewport { min-height: 0; }
      #reservoir-demo-log-viewport { border-top: 1px solid #37424c; }
    </style>
  </head>
  <body>
    <header>
      <h1>Reservoir Viewer</h1>
      <button data-geological-view="top" type="button">Top</button>
      <button data-geological-view="north" type="button">North</button>
      <button data-geological-view="east" type="button">East</button>
      <button data-geological-view="isometric" type="button">Isometric</button>
      <label><input id="reservoir-demo-edges" type="checkbox" checked /> Edges</label>
      <label>Depth <select id="reservoir-demo-depth-mode"><option value="md">MD</option><option value="tvd">TVD</option></select></label>
      <span id="reservoir-demo-status"></span>
    </header>
    <main class="demo-content">
      <div id="reservoir-demo-viewport"></div>
      <div id="reservoir-demo-log-viewport"></div>
    </main>
    <script type="module" src="/src/reservoir/rendering/demo-entry.ts"></script>
  </body>
</html>
